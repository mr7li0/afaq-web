<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>آفاق - لوحة تحكم المعرض</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{font-family:'Kufam',sans-serif;background:#1a2024;color:#f3ecd9;min-height:100vh;}
    .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
    .login-box{background:rgba(32,39,42,0.95);border:1px solid rgba(233,227,211,0.1);border-radius:20px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.4);text-align:center;}
    .login-box h1{font-size:1.6rem;color:#f3ecd9;margin:0 0 8px;}
    .login-box .sub{font-size:0.85rem;color:#9ba5ab;margin:0 0 28px;}
    .login-box input{width:100%;padding:14px 16px;border-radius:12px;background:rgba(0,0,0,0.3);border:1px solid #3a5055;color:#f3ecd9;font-size:1rem;font-family:'Kufam',sans-serif;text-align:center;letter-spacing:4px;box-sizing:border-box;}
    .login-box input:focus{border-color:#4f9cf7;outline:none;}
    .login-btn{width:100%;margin-top:16px;padding:14px;border-radius:12px;background:#4f9cf7;color:#fff;font-size:1rem;font-weight:600;border:none;cursor:pointer;font-family:'Kufam',sans-serif;}
    .login-btn:hover{background:#3b8ae6;}
    .login-error{color:#ef5350;font-size:0.85rem;margin-top:12px;display:none;}
    .admin-dashboard{display:none;}
    .admin-top{padding:calc(56px + env(safe-area-inset-top,0px)) 20px 20px;max-width:1100px;margin:0 auto;}
    .admin-top h1{font-size:1.6rem;color:#f3ecd9;margin:0 0 6px;}
    .admin-top .sub{font-size:0.85rem;color:#9ba5ab;margin:0 0 24px;}
    .admin-tabs{display:flex;gap:6px;margin-bottom:20px;}
    .admin-tab{padding:8px 16px;border-radius:8px;background:rgba(233,227,211,0.06);border:1px solid #3a5055;color:#9ba5ab;font-size:0.85rem;cursor:pointer;font-family:'Kufam',sans-serif;}
    .admin-tab.active{background:#4f9cf7;color:#fff;border-color:#4f9cf7;}
    .admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:24px;}
    .admin-stat{background:rgba(32,39,42,0.9);border:1px solid #3a5055;border-radius:12px;padding:16px 12px;text-align:center;}
    .admin-stat .num{font-size:1.6rem;color:#f3ecd9;margin:0;font-weight:700;}
    .admin-stat .label{font-size:0.7rem;color:#9ba5ab;margin:4px 0 0;}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
    .abtn{padding:10px 18px;border-radius:10px;font-size:0.85rem;font-weight:500;cursor:pointer;border:1px solid #3a5055;background:rgba(233,227,211,0.06);color:#f3ecd9;font-family:'Kufam',sans-serif;}
    .abtn:hover{background:rgba(233,227,211,0.12);}
    .abtn-primary{background:#4f9cf7;color:#fff;border-color:#4f9cf7;}
    .abtn-danger{background:rgba(239,83,80,0.12);color:#ef5350;border-color:rgba(239,83,80,0.2);}
    .admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 20px 40px;max-width:1100px;margin:0 auto;}
    .acard{background:rgba(32,39,42,0.9);border:1px solid #3a5055;border-radius:14px;overflow:hidden;}
    .acard:hover{border-color:#4f9cf7;}
    .acard-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#1a2024;}
    .acard-ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#1a2024;color:#9ba5ab;opacity:0.3;font-size:0.85rem;}
    .acard-body{padding:12px 14px;}
    .acard-title{font-size:0.9rem;font-weight:500;color:#f3ecd9;margin:0 0 4px;}
    .acard-desc{font-size:0.75rem;color:#9ba5ab;margin:0 0 8px;}
    .acard-tags{display:flex;gap:6px;flex-wrap:wrap;}
    .atag{padding:2px 8px;border-radius:5px;font-size:0.65rem;font-weight:500;border:1px solid;}
    .atag-series{background:rgba(255,171,118,0.12);color:#ffab76;border-color:rgba(255,171,118,0.3);}
    .atag-ind{background:rgba(233,227,211,0.06);color:#9ba5ab;border-color:rgba(233,227,211,0.1);}
    .atag-groups{background:rgba(126,200,160,0.12);color:#7ec8a0;border-color:rgba(126,200,160,0.3);}
    .acard-btns{display:flex;gap:6px;margin-top:10px;}
    .acard-btns button{flex:1;padding:6px 0;border-radius:7px;font-size:0.72rem;cursor:pointer;border:1px solid #3a5055;background:transparent;color:#9ba5ab;font-family:'Kufam',sans-serif;}
    .acard-btns button:hover{background:rgba(233,227,211,0.08);color:#f3ecd9;}
    .acard-btns .del:hover{background:rgba(239,83,80,0.15);color:#ef5350;border-color:rgba(239,83,80,0.3);}
    .modal-bg{position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;}
    .modal-bg.open{display:flex;}
    .modal{background:#20272a;border:1px solid #3a5055;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px 20px;box-shadow:0 24px 80px rgba(0,0,0,0.5);}
    .modal h2{font-size:1.2rem;color:#f3ecd9;margin:0 0 18px;}
    .fg{margin-bottom:14px;}
    .fg label{display:block;font-size:0.75rem;color:#9ba5ab;margin-bottom:5px;}
    .fg input,.fg textarea,.fg select{width:100%;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,0.25);border:1px solid #3a5055;color:#f3ecd9;font-size:0.85rem;font-family:'Kufam',sans-serif;box-sizing:border-box;}
    .fg input:focus,.fg textarea:focus,.fg select:focus{border-color:#4f9cf7;outline:none;}
    .fg textarea{min-height:60px;resize:vertical;}
    .fg select option{background:#20272a;color:#f3ecd9;}
    .frow{display:flex;gap:10px;}
    .frow .fg{flex:1;}
    .factions{display:flex;gap:10px;margin-top:18px;}
    .factions button{flex:1;padding:12px;border-radius:10px;font-size:0.88rem;font-weight:500;cursor:pointer;font-family:'Kufam',sans-serif;}
    .fsave{background:#4f9cf7;color:#fff;border:1px solid #4f9cf7;}
    .fcancel{background:transparent;color:#9ba5ab;border:1px solid #3a5055;}
    .fcancel:hover{background:rgba(233,227,211,0.06);}
    .groups-editor{border:1px solid #3a5055;border-radius:10px;padding:12px;margin-top:10px;}
    .group-item{background:rgba(0,0,0,0.2);border:1px solid #3a5055;border-radius:8px;padding:10px;margin-bottom:8px;}
    .group-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .group-item-header span{font-size:0.8rem;color:#9ba5ab;}
    .group-item-header button{background:none;border:none;color:#ef5350;cursor:pointer;font-size:0.8rem;}
    .group-imgs{display:flex;gap:6px;flex-wrap:wrap;}
    .group-imgs img{width:60px;height:60px;object-fit:cover;border-radius:6px;}
    .group-imgs .img-placeholder{width:60px;height:60px;background:#1a2024;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9ba5ab;font-size:0.6rem;}
    .add-group-btn{width:100%;padding:8px;border-radius:8px;border:1px dashed #3a5055;background:transparent;color:#9ba5ab;cursor:pointer;font-size:0.8rem;font-family:'Kufam',sans-serif;margin-top:8px;}
    .add-group-btn:hover{border-color:#4f9cf7;color:#4f9cf7;}
    .empty-msg{grid-column:1/-1;text-align:center;color:#9ba5ab;opacity:0.5;padding:50px 0;}
    @media(max-width:768px){.admin-grid{grid-template-columns:1fr;}.frow{flex-direction:column;gap:0;}}
  </style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>آفاق</h1>
    <p class="sub">لوحة تحكم المعرض</p>
    <input type="password" id="pw-input" placeholder="كلمة المرور" autocomplete="off">
    <button class="login-btn" id="login-btn">دخول</button>
    <p class="login-error" id="login-error">كلمة المرور غير صحيحة</p>
  </div>
</div>

<div class="admin-dashboard" id="admin-dashboard">
  <div class="admin-top">
    <h1>لوحة تحكم المعرض</h1>
    <p class="sub">أضف وتعديل وحذف صور المعرض</p>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="gallery">المعرض</button>
      <button class="admin-tab" data-tab="stats">الإحصائيات</button>
    </div>
    <div id="tab-gallery">
      <div class="admin-stats" id="stats"></div>
      <div class="admin-actions">
        <button class="abtn abtn-primary" onclick="openAddModal()">+ إضافة</button>
        <button class="abtn" onclick="exportData()">تصدير</button>
        <button class="abtn" onclick="importData()">استيراد</button>
        <button class="abtn abtn-danger" onclick="clearAll()">مسح الكل</button>
      </div>
      <div class="admin-grid" id="admin-grid"></div>
    </div>
    <div id="tab-stats" style="display:none;">
      <div class="admin-stats" id="site-stats"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="item-modal">
  <div class="modal">
    <h2 id="modal-title">إضافة جديدة</h2>
    <input type="hidden" id="edit-id">
    <div class="fg"><label>العنوان *</label><input type="text" id="item-title" placeholder="مثال: بسم الله الرحمن الرحيم"></div>
    <div class="fg"><label>الوصف</label><textarea id="item-desc" placeholder="وصف مختصر"></textarea></div>
    <div class="frow">
      <div class="fg"><label>النوع</label>
        <select id="item-type" onchange="toggleSeriesGroups()">
          <option value="individual">فردي</option>
          <option value="series">سلسلة</option>
        </select>
      </div>
    </div>
    <!-- Individual images -->
    <div id="individual-section">
      <div class="fg"><label>صور (يمكن اختيار عدة صور)</label>
        <input type="file" id="item-files" accept="image/*" multiple style="color:#9ba5ab;font-size:0.8rem;">
      </div>
      <div class="fg"><label>أو روابط صور (فاصلة بينها)</label>
        <input type="text" id="item-image" placeholder="url1.jpg, url2.jpg">
      </div>
      <div id="current-images" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;"></div>
    </div>
    <!-- Series groups -->
    <div id="series-section" style="display:none;">
      <div class="fg"><label>غلاف السلسلة</label>
        <input type="file" id="series-cover" accept="image/*" style="color:#9ba5ab;font-size:0.8rem;">
        <input type="text" id="series-cover-url" placeholder="رابط الغلاف" style="margin-top:6px;">
      </div>
      <label style="display:block;font-size:0.75rem;color:#9ba5ab;margin-bottom:5px;">مجموعات الصور</label>
      <div class="groups-editor" id="groups-editor"></div>
      <button class="add-group-btn" onclick="addGroup()">+ إضافة مجموعة</button>
    </div>
    <div class="factions">
      <button class="fcancel" onclick="closeModal()">إلغاء</button>
      <button class="fsave" onclick="saveItem()">حفظ</button>
    </div>
  </div>
</div>

<script>
(function(){
  var PW='mr7li0',SK='afaq_admin_auth',GK='afaq_gallery_data',ST='afaq_site_stats';
  if(sessionStorage.getItem(SK)==='1')showAdmin();
  document.getElementById('login-btn').addEventListener('click',tryLogin);
  document.getElementById('pw-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
  function tryLogin(){if(document.getElementById('pw-input').value.trim()===PW){sessionStorage.setItem(SK,'1');showAdmin();}else{document.getElementById('login-error').style.display='block';document.getElementById('pw-input').value='';}}
  function showAdmin(){document.getElementById('login-screen').style.display='none';document.getElementById('admin-dashboard').style.display='block';initAdmin();}

  // Stats tracking
  function trackVisit(){var s=JSON.parse(localStorage.getItem(ST)||'{"visits":0,"downloads":0}');s.visits++;localStorage.setItem(ST,JSON.stringify(s));}
  function trackDownload(){var s=JSON.parse(localStorage.getItem(ST)||'{"visits":0,"downloads":0}');s.downloads++;localStorage.setItem(ST,JSON.stringify(s));}
  // Track visit on load
  trackVisit();

  // Make trackDownload global for download button
  window.trackDownload=trackDownload;

  function initAdmin(){
    function loadData(){try{var s=localStorage.getItem(GK);if(s){var d=JSON.parse(s);if(Array.isArray(d))return d;}}catch(e){}return[];}
    function saveData(d){try{localStorage.setItem(GK,JSON.stringify(d));}catch(e){alert('خطأ في الحفظ');}}
    function nextId(d){var m=0;d.forEach(function(i){if(i.id>m)m=i.id;});return m+1;}
    function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
    function getImgSrc(src){if(!src)return'';if(src.indexOf('data:')===0||src.indexOf('http')===0)return src;return'./assets/gallery/'+src;}
    var data=loadData(),pendingGroups=[];

    function renderStats(){
      var t=data.length,ind=data.filter(function(d){return d.type==='individual';}).length,ser=data.filter(function(d){return d.type==='series';}).length;
      document.getElementById('stats').innerHTML='<div class="admin-stat"><p class="num">'+t+'</p><p class="label">عناصر</p></div><div class="admin-stat"><p class="num">'+ind+'</p><p class="label">فردي</p></div><div class="admin-stat"><p class="num">'+ser+'</p><p class="label">سلسلة</p></div>';
    }

    function renderSiteStats(){
      var s=JSON.parse(localStorage.getItem(ST)||'{"visits":0,"downloads":0}');
      document.getElementById('site-stats').innerHTML='<div class="admin-stat"><p class="num">'+s.visits+'</p><p class="label">زوار الموقع</p></div><div class="admin-stat"><p class="num">'+s.downloads+'</p><p class="label">تحميلات التطبيق</p></div>';
    }

    function renderGrid(){
      var g=document.getElementById('admin-grid');
      if(!g)return;
      if(data.length===0){g.innerHTML='<p class="empty-msg">لا توجد عناصر. اضغط "+ إضافة" للبدء.</p>';return;}
      g.innerHTML='';
      data.forEach(function(item){
        var c=document.createElement('div');c.className='acard';
        var imgSrc='';
        if(item.type==='series'){
          imgSrc=getImgSrc(item.cover||(item.images&&item.images[0])||'');
        }else{
          imgSrc=getImgSrc(item.images&&item.images[0]||'');
        }
        var imgH=imgSrc?'<img class="acard-img" src="'+imgSrc+'" alt="'+esc(item.title)+'" onerror="this.outerHTML=\'<div class=acard-ph>\'+esc(item.title)+\'</div>\'">':'<div class="acard-ph">'+esc(item.title)+'</div>';
        var tags='';
        if(item.type==='series'){
          tags='<span class="atag atag-series">سلسلة</span>';
          var gc=item.seriesGroups?item.seriesGroups.length:0;
          if(gc>0)tags+='<span class="atag atag-groups">'+gc+' مجموعات</span>';
        }else{
          tags='<span class="atag atag-ind">فردي</span>';
          var ic=item.images?item.images.length:0;
          if(ic>1)tags+='<span class="atag atag-groups">'+ic+' صور</span>';
        }
        c.innerHTML=imgH+'<div class="acard-body"><p class="acard-title">'+esc(item.title)+'</p><p class="acard-desc">'+esc(item.desc||'')+'</p><div class="acard-tags">'+tags+'</div><div class="acard-btns"><button onclick="admEdit('+item.id+')">تعديل</button><button class="del" onclick="admDelete('+item.id+')">حذف</button></div></div>';
        g.appendChild(c);
      });
    }

    function render(){renderStats();renderGrid();}

    // Tabs
    document.querySelectorAll('.admin-tab').forEach(function(tab){
      tab.addEventListener('click',function(){
        document.querySelectorAll('.admin-tab').forEach(function(t){t.classList.remove('active');});
        this.classList.add('active');
        var t=this.dataset.tab;
        document.getElementById('tab-gallery').style.display=t==='gallery'?'':'none';
        document.getElementById('tab-stats').style.display=t==='stats'?'':'none';
        if(t==='stats')renderSiteStats();
      });
    });

    // Groups editor
    window.addGroup=function(){
      var ge=document.getElementById('groups-editor');
      var gi=pendingGroups.length;
      pendingGroups.push({label:'',images:[]});
      var div=document.createElement('div');div.className='group-item';div.id='group-'+gi;
      div.innerHTML='<div class="group-item-header"><span>المجموعة '+(gi+1)+'</span><button onclick="removeGroup('+gi+')">حذف</button></div><div class="fg"><input type="text" placeholder="تسمية المجموعة" onchange="pendingGroups['+gi+'].label=this.value"></div><div class="fg"><input type="file" accept="image/*" multiple onchange="handleGroupFiles('+gi+',this.files)"></div><div class="group-imgs" id="group-imgs-'+gi+'"></div>';
      ge.appendChild(div);
    };

    window.removeGroup=function(idx){
      pendingGroups[idx]=null;
      var el=document.getElementById('group-'+idx);
      if(el)el.remove();
    };

    window.handleGroupFiles=function(idx,files){
      var arr=Array.from(files);
      var promises=arr.map(function(f){return new Promise(function(r){var reader=new FileReader();reader.onload=function(e){r(e.target.result);};reader.readAsDataURL(f);});});
      Promise.all(promises).then(function(imgs){
        if(!pendingGroups[idx])pendingGroups[idx]={label:'',images:[]};
        pendingGroups[idx].images=pendingGroups[idx].images.concat(imgs);
        var container=document.getElementById('group-imgs-'+idx);
        container.innerHTML='';
        pendingGroups[idx].images.forEach(function(src,ii){
          var img=document.createElement('img');img.src=src;
          container.appendChild(img);
        });
      });
    };

    window.toggleSeriesGroups=function(){
      var t=document.getElementById('item-type').value;
      document.getElementById('individual-section').style.display=t==='individual'?'':'none';
      document.getElementById('series-section').style.display=t==='series'?'':'none';
    };

    // Modal
    window.openAddModal=function(){
      document.getElementById('modal-title').textContent='إضافة جديدة';
      document.getElementById('edit-id').value='';
      document.getElementById('item-title').value='';
      document.getElementById('item-desc').value='';
      document.getElementById('item-type').value='individual';
      document.getElementById('item-image').value='';
      document.getElementById('item-files').value='';
      document.getElementById('series-cover').value='';
      document.getElementById('series-cover-url').value='';
      document.getElementById('current-images').innerHTML='';
      document.getElementById('groups-editor').innerHTML='';
      pendingGroups=[];
      toggleSeriesGroups();
      document.getElementById('item-modal').classList.add('open');
    };

    window.admEdit=function(id){
      var item=data.find(function(d){return d.id===id;});
      if(!item)return;
      document.getElementById('modal-title').textContent='تعديل';
      document.getElementById('edit-id').value=id;
      document.getElementById('item-title').value=item.title;
      document.getElementById('item-desc').value=item.desc||'';
      document.getElementById('item-type').value=item.type||'individual';
      document.getElementById('item-image').value='';
      document.getElementById('item-files').value='';
      document.getElementById('current-images').innerHTML='';
      document.getElementById('groups-editor').innerHTML='';
      pendingGroups=[];

      if(item.type==='series'){
        document.getElementById('series-cover-url').value=item.cover||'';
        if(item.seriesGroups){
          item.seriesGroups.forEach(function(g,gi){
            pendingGroups.push({label:g.label||'',images:g.images||[]});
            addGroup();
            var container=document.getElementById('group-imgs-'+gi);
            if(container&&g.images){
              container.innerHTML='';
              g.images.forEach(function(src){
                var img=document.createElement('img');img.src=getImgSrc(src);
                container.appendChild(img);
              });
            }
          });
        }
      }else{
        if(item.images&&item.images.length>0){
          var ci=document.getElementById('current-images');
          item.images.forEach(function(src){
            var img=document.createElement('img');img.src=getImgSrc(src);
            img.style.cssText='width:60px;height:60px;object-fit:cover;border-radius:6px;';
            ci.appendChild(img);
          });
        }
      }
      toggleSeriesGroups();
      document.getElementById('item-modal').classList.add('open');
    };

    window.closeModal=function(){document.getElementById('item-modal').classList.remove('open');};
    document.getElementById('item-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

    window.saveItem=function(){
      var title=document.getElementById('item-title').value.trim();
      var desc=document.getElementById('item-desc').value.trim();
      var type=document.getElementById('item-type').value;
      var editId=document.getElementById('edit-id').value;
      if(!title){alert('العنوان مطلوب');return;}

      function doSave(images,cover,seriesGroups){
        if(editId){
          var item=data.find(function(d){return d.id===parseInt(editId);});
          if(item){item.title=title;item.desc=desc;item.type=type;item.images=images;if(cover)item.cover=cover;if(seriesGroups)item.seriesGroups=seriesGroups;}
        }else{
          var newItem={id:nextId(data),title:title,desc:desc,type:type,images:images};
          if(cover)newItem.cover=cover;
          if(seriesGroups)newItem.seriesGroups=seriesGroups;
          data.push(newItem);
        }
        saveData(data);render();closeModal();
      }

      if(type==='series'){
        // Cover
        var coverFile=document.getElementById('series-cover').files[0];
        var coverUrl=document.getElementById('series-cover-url').value.trim();
        function saveWithCover(coverSrc){
          var groups=pendingGroups.filter(function(g){return g&&g.images&&g.images.length>0;});
          var allImages=[];
          groups.forEach(function(g){g.images.forEach(function(img){allImages.push(img);});});
          doSave(allImages.length>0?allImages:[],coverSrc,groups);
        }
        if(coverFile){
          var r=new FileReader();
          r.onload=function(e){saveWithCover(e.target.result);};
          r.readAsDataURL(coverFile);
        }else{
          saveWithCover(coverUrl||'');
        }
      }else{
        // Individual
        var fileInput=document.getElementById('item-files');
        var imageUrl=document.getElementById('item-image').value.trim();
        if(fileInput.files&&fileInput.files.length>0){
          var files=Array.from(fileInput.files);
          var promises=files.map(function(f){return new Promise(function(r){var reader=new FileReader();reader.onload=function(e){r(e.target.result);};reader.readAsDataURL(f);});});
          Promise.all(promises).then(function(imgs){doSave(imgs);});
        }else if(imageUrl){
          doSave(imageUrl.split(',').map(function(s){return s.trim();}).filter(function(s){return s;}));
        }else{
          alert('أضف صوراً');
        }
      }
    };

    window.admDelete=function(id){
      var item=data.find(function(d){return d.id===id;});
      if(!item)return;
      if(!confirm('حذف "'+item.title+'"؟'))return;
      data=data.filter(function(d){return d.id!==id;});
      saveData(data);render();
    };

    window.clearAll=function(){if(!confirm('مسح الكل؟'))return;data=[];saveData(data);render();};
    window.exportData=function(){var json=JSON.stringify(data,null,2);var blob=new Blob([json],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='gallery-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);};
    window.importData=function(){var input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var imported=JSON.parse(ev.target.result);if(!Array.isArray(imported)){alert('ملف غير صحيح');return;}data=data.concat(imported);saveData(data);render();}catch(err){alert('خطأ: '+err.message);}};reader.readAsText(file);};input.click();};

    render();
  }
})();
</script>
</body>
</html>
