<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>آفاق - لوحة تحكم المعرض</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family:'Kufam',sans-serif; background:#1a2024; color:#f3ecd9; min-height:100vh; }

    /* Login Screen */
    .login-screen {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:20px;
    }
    .login-box {
      background:rgba(32,39,42,0.95); border:1px solid rgba(233,227,211,0.1);
      border-radius:20px; padding:40px 32px; width:100%; max-width:380px;
      box-shadow:0 20px 60px rgba(0,0,0,0.4); text-align:center;
    }
    .login-box h1 { font-size:1.6rem; color:#f3ecd9; margin:0 0 8px; }
    .login-box .sub { font-size:0.85rem; color:#9ba5ab; margin:0 0 28px; }
    .login-box input {
      width:100%; padding:14px 16px; border-radius:12px;
      background:rgba(0,0,0,0.3); border:1px solid #3a5055;
      color:#f3ecd9; font-size:1rem; font-family:'Kufam',sans-serif;
      text-align:center; letter-spacing:4px; box-sizing:border-box;
    }
    .login-box input:focus { border-color:#4f9cf7; outline:none; }
    .login-box input::placeholder { letter-spacing:0; color:#6a7c7e; }
    .login-btn {
      width:100%; margin-top:16px; padding:14px; border-radius:12px;
      background:#4f9cf7; color:#fff; font-size:1rem; font-weight:600;
      border:none; cursor:pointer; font-family:'Kufam',sans-serif;
      transition:all 0.2s;
    }
    .login-btn:hover { background:#3b8ae6; }
    .login-error { color:#ef5350; font-size:0.85rem; margin-top:12px; display:none; }

    /* Admin Dashboard */
    .admin-dashboard { display:none; }
    .admin-top { padding:calc(56px + env(safe-area-inset-top, 0px)) 20px 20px; max-width:1100px; margin:0 auto; }
    .admin-top h1 { font-size:1.6rem; color:#f3ecd9; margin:0 0 6px; }
    .admin-top .sub { font-size:0.85rem; color:#9ba5ab; margin:0 0 24px; }
    .admin-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:24px; }
    .admin-stat { background:rgba(32,39,42,0.9); border:1px solid #3a5055; border-radius:12px; padding:16px 12px; text-align:center; }
    .admin-stat .num { font-size:1.6rem; color:#f3ecd9; margin:0; font-weight:700; }
    .admin-stat .label { font-size:0.7rem; color:#9ba5ab; margin:4px 0 0; }
    .admin-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .abtn { padding:10px 18px; border-radius:10px; font-size:0.85rem; font-weight:500; cursor:pointer; border:1px solid #3a5055; background:rgba(233,227,211,0.06); color:#f3ecd9; font-family:'Kufam',sans-serif; transition:all 0.2s; }
    .abtn:hover { background:rgba(233,227,211,0.12); }
    .abtn-primary { background:#4f9cf7; color:#fff; border-color:#4f9cf7; }
    .abtn-primary:hover { background:#3b8ae6; }
    .abtn-danger { background:rgba(239,83,80,0.12); color:#ef5350; border-color:rgba(239,83,80,0.2); }
    .abtn-danger:hover { background:rgba(239,83,80,0.2); }

    .admin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; padding:0 20px 40px; max-width:1100px; margin:0 auto; }
    .acard { background:rgba(32,39,42,0.9); border:1px solid #3a5055; border-radius:14px; overflow:hidden; transition:all 0.25s; }
    .acard:hover { border-color:#4f9cf7; }
    .acard-img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#1a2024; }
    .acard-ph { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:#1a2024; color:#9ba5ab; opacity:0.3; font-size:0.85rem; }
    .acard-body { padding:12px 14px; }
    .acard-title { font-size:0.9rem; font-weight:500; color:#f3ecd9; margin:0 0 4px; }
    .acard-desc { font-size:0.75rem; color:#9ba5ab; margin:0 0 8px; }
    .acard-tags { display:flex; gap:6px; flex-wrap:wrap; }
    .atag { padding:2px 8px; border-radius:5px; font-size:0.65rem; font-weight:500; border:1px solid; }
    .atag-series { background:rgba(79,156,247,0.12); color:#4f9cf7; border-color:rgba(79,156,247,0.3); }
    .atag-ind { background:rgba(233,227,211,0.06); color:#9ba5ab; border-color:rgba(233,227,211,0.1); }
    .atag-carousel { background:rgba(255,171,118,0.12); color:#ffab76; border-color:rgba(255,171,118,0.3); }
    .atag-hero { background:rgba(126,200,160,0.12); color:#7ec8a0; border-color:rgba(126,200,160,0.3); }
    .acard-btns { display:flex; gap:6px; margin-top:10px; }
    .acard-btns button { flex:1; padding:6px 0; border-radius:7px; font-size:0.72rem; cursor:pointer; border:1px solid #3a5055; background:transparent; color:#9ba5ab; font-family:'Kufam',sans-serif; transition:all 0.2s; }
    .acard-btns button:hover { background:rgba(233,227,211,0.08); color:#f3ecd9; }
    .acard-btns .del:hover { background:rgba(239,83,80,0.15); color:#ef5350; border-color:rgba(239,83,80,0.3); }

    /* Modal */
    .modal-bg { position:fixed; inset:0; z-index:20000; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal-bg.open { display:flex; }
    .modal { background:#20272a; border:1px solid #3a5055; border-radius:16px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:24px 20px; box-shadow:0 24px 80px rgba(0,0,0,0.5); }
    .modal h2 { font-size:1.2rem; color:#f3ecd9; margin:0 0 18px; }
    .fg { margin-bottom:14px; }
    .fg label { display:block; font-size:0.75rem; color:#9ba5ab; margin-bottom:5px; }
    .fg input, .fg textarea, .fg select {
      width:100%; padding:10px 12px; border-radius:8px;
      background:rgba(0,0,0,0.25); border:1px solid #3a5055;
      color:#f3ecd9; font-size:0.85rem; font-family:'Kufam',sans-serif; box-sizing:border-box;
    }
    .fg input:focus, .fg textarea:focus, .fg select:focus { border-color:#4f9cf7; outline:none; }
    .fg textarea { min-height:60px; resize:vertical; }
    .fg select option { background:#20272a; color:#f3ecd9; }
    .frow { display:flex; gap:10px; }
    .frow .fg { flex:1; }
    .factions { display:flex; gap:10px; margin-top:18px; }
    .factions button { flex:1; padding:12px; border-radius:10px; font-size:0.88rem; font-weight:500; cursor:pointer; font-family:'Kufam',sans-serif; transition:all 0.2s; }
    .fsave { background:#4f9cf7; color:#fff; border:1px solid #4f9cf7; }
    .fcancel { background:transparent; color:#9ba5ab; border:1px solid #3a5055; }
    .fcancel:hover { background:rgba(233,227,211,0.06); }
    .empty-msg { grid-column:1/-1; text-align:center; color:#9ba5ab; opacity:0.5; padding:50px 0; }

    @media (max-width:768px) {
      .admin-grid { grid-template-columns:1fr; }
      .frow { flex-direction:column; gap:0; }
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>آفاق</h1>
    <p class="sub">لوحة تحكم المعرض — أدخل كلمة المرور</p>
    <input type="password" id="pw-input" placeholder="كلمة المرور" autocomplete="off">
    <button class="login-btn" id="login-btn">دخول</button>
    <p class="login-error" id="login-error">كلمة المرور غير صحيحة</p>
  </div>
</div>

<!-- Admin Dashboard (hidden until login) -->
<div class="admin-dashboard" id="admin-dashboard">
  <div class="admin-top">
    <h1>لوحة تحكم المعرض</h1>
    <p class="sub">أضف وتعديل وحذف صور المعرض — تحكم كامل بالمعرض والكاروسيل</p>
    <div class="admin-stats" id="stats"></div>
    <div class="admin-actions">
      <button class="abtn abtn-primary" onclick="openAddModal()">+ إضافة صورة</button>
      <button class="abtn" onclick="exportData()">تصدير البيانات</button>
      <button class="abtn" onclick="importData()">استيراد البيانات</button>
      <button class="abtn abtn-danger" onclick="clearAll()">مسح الكل</button>
    </div>
  </div>
  <div class="admin-grid" id="admin-grid"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="item-modal">
  <div class="modal">
    <h2 id="modal-title">إضافة صورة جديدة</h2>
    <input type="hidden" id="edit-id">
    <div class="fg">
      <label>عنوان الصورة *</label>
      <input type="text" id="item-title" placeholder="مثال: بسم الله الرحمن الرحيم">
    </div>
    <div class="fg">
      <label>الوصف</label>
      <textarea id="item-desc" placeholder="وصف مختصر للصورة"></textarea>
    </div>
    <div class="frow">
      <div class="fg">
        <label>النوع</label>
        <select id="item-type">
          <option value="individual">فردي</option>
          <option value="series">سلسلة</option>
          <option value="carousel">كاروسيل</option>
        </select>
      </div>
      <div class="fg">
        <label>يظهر في الكاروسيل الرئيسي</label>
        <select id="item-hero">
          <option value="0">لا</option>
          <option value="1">نعم</option>
        </select>
      </div>
    </div>
    <div class="fg">
      <label>رابط الصورة (URL)</label>
      <input type="text" id="item-image" placeholder="assets/gallery/1.jpg">
    </div>
    <div class="fg">
      <label>أو ارفع صورة من جهازك</label>
      <input type="file" id="item-file" accept="image/*" multiple style="color:#9ba5ab;font-size:0.8rem;">
    </div>
    <div class="factions">
      <button class="fcancel" onclick="closeModal()">إلغاء</button>
      <button class="fsave" onclick="saveItem()">حفظ</button>
    </div>
  </div>
</div>

<script>
// Password protection
(function() {
  var PW = 'mr7li0';
  var SESSION_KEY = 'afaq_admin_auth';

  // Check if already authenticated
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    showAdmin();
  }

  document.getElementById('login-btn').addEventListener('click', tryLogin);
  document.getElementById('pw-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin();
  });

  function tryLogin() {
    var val = document.getElementById('pw-input').value.trim();
    if (val === PW) {
      sessionStorage.setItem(SESSION_KEY, '1');
      showAdmin();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  function showAdmin() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-dashboard').style.display = 'block';
    initAdmin();
  }
})();

// Admin Logic
function initAdmin() {
  var STORAGE_KEY = 'afaq_gallery_data';

  function loadData() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    if (typeof galleryData !== 'undefined') return JSON.parse(JSON.stringify(galleryData));
    return [];
  }

  function saveData(d) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) { alert('خطأ في الحفظ'); }
  }

  function nextId(d) { var m = 0; d.forEach(function(i){ if(i.id>m) m=i.id; }); return m+1; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

  var data = loadData();

  function renderStats() {
    var total = data.length;
    var ind = data.filter(function(d){return d.type==='individual';}).length;
    var ser = data.filter(function(d){return d.type==='series';}).length;
    var car = data.filter(function(d){return d.type==='carousel';}).length;
    var imgs = 0; data.forEach(function(d){ imgs += (d.images?d.images.length:1); });
    document.getElementById('stats').innerHTML =
      '<div class="admin-stat"><p class="num">'+total+'</p><p class="label">عناصر</p></div>'+
      '<div class="admin-stat"><p class="num">'+ind+'</p><p class="label">فردي</p></div>'+
      '<div class="admin-stat"><p class="num">'+ser+'</p><p class="label">سلسلة</p></div>'+
      '<div class="admin-stat"><p class="num">'+car+'</p><p class="label">كاروسيل</p></div>'+
      '<div class="admin-stat"><p class="num">'+imgs+'</p><p class="label">صور</p></div>';
  }

  function renderGrid() {
    var g = document.getElementById('admin-grid');
    if (!g) return;
    if (data.length === 0) { g.innerHTML = '<p class="empty-msg">لا توجد عناصر. اضغط "+ إضافة صورة" للبدء.</p>'; return; }
    g.innerHTML = '';
    data.forEach(function(item) {
      var c = document.createElement('div');
      c.className = 'acard';
      var imgH = '';
      if (item.images && item.images.length > 0) {
        var src = item.images[0];
        if (src.indexOf('data:')!==0 && src.indexOf('http')!==0) src = 'assets/gallery/'+src;
        imgH = '<img class="acard-img" src="'+src+'" alt="'+esc(item.title)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="acard-ph" style="display:none">'+esc(item.title)+'</div>';
      } else {
        imgH = '<div class="acard-ph">'+esc(item.title)+'</div>';
      }
      var tags = '';
      if (item.type==='series') tags+='<span class="atag atag-series">سلسلة</span>';
      else if (item.type==='carousel') tags+='<span class="atag atag-carousel">كاروسيل</span>';
      else tags+='<span class="atag atag-ind">فردي</span>';
      if (item.hero) tags+='<span class="atag atag-hero">كاروسيل رئيسي</span>';
      var cnt = item.images?item.images.length:1;
      if (cnt>1) tags+='<span class="atag" style="background:rgba(233,227,211,0.06);color:#9ba5ab;border-color:rgba(233,227,211,0.1);">'+cnt+' صور</span>';
      c.innerHTML = imgH+'<div class="acard-body"><p class="acard-title">'+esc(item.title)+'</p><p class="acard-desc">'+esc(item.desc||'')+'</p><div class="acard-tags">'+tags+'</div><div class="acard-btns"><button onclick="admEdit('+item.id+')">تعديل</button><button onclick="admToggleHero('+item.id+')">'+(item.hero?'إزالة من الكاروسيل':'إضافة للكاروسيل')+'</button><button class="del" onclick="admDelete('+item.id+')">حذف</button></div></div>';
      g.appendChild(c);
    });
  }

  function render() { renderStats(); renderGrid(); }

  // Modal
  window.openAddModal = function() {
    document.getElementById('modal-title').textContent = 'إضافة صورة جديدة';
    document.getElementById('edit-id').value = '';
    document.getElementById('item-title').value = '';
    document.getElementById('item-desc').value = '';
    document.getElementById('item-type').value = 'individual';
    document.getElementById('item-hero').value = '0';
    document.getElementById('item-image').value = '';
    document.getElementById('item-file').value = '';
    document.getElementById('item-modal').classList.add('open');
  };

  window.admEdit = function(id) {
    var item = data.find(function(d){return d.id===id;});
    if(!item) return;
    document.getElementById('modal-title').textContent = 'تعديل الصورة';
    document.getElementById('edit-id').value = id;
    document.getElementById('item-title').value = item.title;
    document.getElementById('item-desc').value = item.desc||'';
    document.getElementById('item-type').value = item.type||'individual';
    document.getElementById('item-hero').value = item.hero?'1':'0';
    document.getElementById('item-image').value = (item.images&&item.images[0])?item.images[0]:'';
    document.getElementById('item-file').value = '';
    document.getElementById('item-modal').classList.add('open');
  };

  window.closeModal = function() { document.getElementById('item-modal').classList.remove('open'); };
  document.getElementById('item-modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

  window.saveItem = function() {
    var title = document.getElementById('item-title').value.trim();
    var desc = document.getElementById('item-desc').value.trim();
    var type = document.getElementById('item-type').value;
    var hero = document.getElementById('item-hero').value === '1';
    var imageUrl = document.getElementById('item-image').value.trim();
    var fileInput = document.getElementById('item-file');
    var editId = document.getElementById('edit-id').value;

    if (!title) { alert('العنوان مطلوب'); return; }

    function doSave(images) {
      if (editId) {
        var item = data.find(function(d){return d.id===parseInt(editId);});
        if (item) { item.title=title; item.desc=desc; item.type=type; item.hero=hero; item.images=images; }
      } else {
        data.push({ id:nextId(data), title:title, desc:desc, type:type, hero:hero, images:images });
      }
      saveData(data);
      render();
      closeModal();
    }

    if (fileInput.files && fileInput.files.length > 0) {
      var files = Array.from(fileInput.files);
      var promises = files.map(function(f){
        return new Promise(function(resolve){
          var r = new FileReader();
          r.onload = function(e){ resolve(e.target.result); };
          r.readAsDataURL(f);
        });
      });
      Promise.all(promises).then(doSave);
    } else {
      if (!imageUrl) { alert('أدخل رابط الصورة أو ارفع ملفاً'); return; }
      doSave(imageUrl.split(',').map(function(s){return s.trim();}).filter(function(s){return s;}));
    }
  };

  window.admDelete = function(id) {
    var item = data.find(function(d){return d.id===id;});
    if(!item) return;
    if(!confirm('حذف "'+item.title+'"؟')) return;
    data = data.filter(function(d){return d.id!==id;});
    saveData(data); render();
  };

  window.admToggleHero = function(id) {
    var item = data.find(function(d){return d.id===id;});
    if(!item) return;
    item.hero = !item.hero;
    saveData(data); render();
  };

  window.clearAll = function() {
    if(!confirm('مسح جميع العناصر؟')) return;
    data = [];
    saveData(data); render();
  };

  window.exportData = function() {
    var json = JSON.stringify(data, null, 2);
    var blob = new Blob([json], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'gallery-data-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  window.importData = function() {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = function(e) {
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var imported = JSON.parse(ev.target.result);
          if(!Array.isArray(imported)) { alert('ملف غير صحيح'); return; }
          if(!confirm('استيراد '+imported.length+' عنصر؟')) return;
          var ids = {};
          data.forEach(function(d){ ids[d.id]=true; });
          imported.forEach(function(item){
            if(ids[item.id]) item.id = nextId(data);
            data.push(item);
            ids[item.id]=true;
          });
          saveData(data); render();
        } catch(err) { alert('خطأ: '+err.message); }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  render();
}
</script>
</body>
</html>
